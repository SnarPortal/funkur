<script>
/* Tússar: ger leyst krittstrik og tússulit á canvas úr vanligum SVG-vegum.

<script>

  function draw() {
    ov.textContent = ''; const hl = el('div', 'hl', ov); hl.innerHTML = $('fugl').querySelector('svg').outerHTML + '<h1>Skvett</h1>';
    const hk = el('div', 'hk', ov); btn(hk, Ic('<path d="M12 5v14M5 12h14"/>', 18) + 'Nýggj søga', '', () => newS()).className = 'tb hi'; btn(hk, Ic('<path d="M4 20l4-1L20 7l-3-3L5 16zM14 7l3 3"/>', 18) + 'Lær at tekna', '', () => { close(); LAERA.open(); }).className = 'tb';
    el('h3', '', ov, 'Søguterningar'); dice(el('div', 'ht', ov));
    el('h3', '', ov, 'Mínar søgur'); const g = el('div', 'hs', ov);
    idx.forEach(e => {
      const c = el('div', 'hc', g), im = el('img', '', c); if (e.im) im.src = e.im; im.alt = ''; im.onclick = () => openS(e.id); im.style.cursor = 'pointer';
      el('b', '', c, esc(e.n) || 'Søga uttan heiti'); el('small', '', c, (e.p || 1) + ((e.p || 1) === 1 ? ' ark' : ' ørk')); const r = el('div', '', c);
      btn(r, e.id === cur ? 'Halt fram' : 'Lat upp', '', () => openS(e.id)).className = 'tb hi';

  /* ---------- fuglurin gevur eina uppgávu ---------- */
  const UPPG = ['Tekna ein fisk, sum er bangin fyri vatni.', 'Tekna eitt hús, har eitt trøll býr.', 'Tekna ein fugl við hatti.', 'Tekna tað, tú át til morgunmat.', 'Tekna ein bil, sum kann flúgva.', 'Tekna ein seyð í regni.', 'Tekna ein kong, sum hevur mist krúnuna.', 'Tekna eitt skrímsl, sum er blítt.', 'Tekna ein bát í stormi.', 'Tekna eina kaku við tíggju ljósum.', 'Tekna ein hund, sum dansar.', 'Tekna mánan við brillum.', 'Tekna eitt træ, har skógvar veksa.', 'Tekna eina rakett á veg til eina nýggja gongustjørnu.', 'Tekna tað størsta dýrið, tú kennir, og tað minsta við síðuna av.', 'Tekna eitt hús undir sjónum.'];

  const next = () => { let k; do k = Math.floor(Math.random() * UPPG.length); while (k === ui); ui = k; ub.textContent = UPPG[k]; ub.style.left = $('fugl').offsetLeft + 60 + 'px'; ub.hidden = false; fxs.squeak(); clearTimeout(ut); ut = setTimeout(() => { ub.hidden = true; }, 15000); };
